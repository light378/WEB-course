<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гідроелектростанція - моніторинг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f0f4f8; }
        .metric-card {
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background: white;
        }
        .turbine-indicator {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1e88e5;
        }
        .status-online { color: green; font-weight: bold; }
        .status-offline { color: red; font-weight: bold; }
        canvas { max-height: 300px; }
        .table-responsive { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center mb-4">🌊 Гідроелектростанція (ГЕС) – моніторинг у реальному часі</h1>
    <div class="row">
        <div class="col-md-3">
            <div class="metric-card text-center">
                <h5>Рівень води (верх. б'єф)</h5>
                <h2 id="waterLevel">-- м</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="metric-card text-center">
                <h5>Витрата води</h5>
                <h2 id="flowRate">-- м³/с</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="metric-card text-center">
                <h5>Потужність ген.</h5>
                <h2 id="power">-- МВт</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="metric-card text-center">
                <h5>Ефективність турбіни</h5>
                <h2 id="efficiency">-- %</h2>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="metric-card">
                <h5>🔄 Оберти турбіни</h5>
                <div class="turbine-indicator" id="rpm">-- об/хв</div>
                <div class="progress mt-2">
                    <div id="rpmBar" class="progress-bar bg-info" style="width:0%"></div>
                </div>
                <p class="mt-2">Статус: <span id="status">--</span></p>
            </div>
        </div>
        <div class="col-md-6">
            <div class="metric-card">
                <h5>📊 Ефективність турбіни</h5>
                <canvas id="efficiencyChart" width="200" height="200"></canvas>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="metric-card">
                <h5>📈 Рівень води (м)</h5>
                <canvas id="waterLevelChart"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="metric-card">
                <h5>⚡ Потужність (МВт)</h5>
                <canvas id="powerChart"></canvas>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <div class="metric-card">
                <h5>📋 Історія параметрів (останні 10)</h5>
                <div id="historyTable" class="table-responsive"></div>
            </div>
        </div>
    </div>
</div>
<script src="hydro_app.js"></script>
</body>
</html>
